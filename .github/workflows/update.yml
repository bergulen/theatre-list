name: Update theatre list

on:
  schedule:
    - cron: "0 4 * * *"   # every day at 04:00 UTC (07:00 in Istanbul)
  workflow_dispatch:       # adds a "Run workflow" button for manual updates
  push:
    paths:
      - plays.txt          # refresh right away when you add or remove a play

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scrape.py

      - name: Save the new list
        run: |
          git config user.name "theatre-bot"
          git config user.email "theatre-bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update performances"
          git push
